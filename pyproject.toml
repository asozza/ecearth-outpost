[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecpost"
version = "0.0.1"
authors = [
  { name="Alessandro Sozza", email="asozza.ph@gmail.com" },
]
description = "ecearth-outpost; output post-processing tools for EC-Earth4"
readme = "README.md"
keywords = ["climate", "modeling", "diagnostics", "hpc"]
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "xarray",
    "psutil",
    "numpy",
    "xeofs",
    "gsw",
    "pyyaml",
    "scipy",
    "cftime",
    "netcdf4",
    "matplotlib",
    "cartopy",
    "cmocean",
    "dask",
    "cdo"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
climatology = "ecpost.launch.launch_climatology:main"
timeseries = "ecpost.launch.launch_timeseries:main"
layers = "ecpost.launch.launch_layers:main"
profile = "ecpost.launch.launch_profile:main"
hovmoller = "ecpost.launch.launch_hovmoller:main"
map = "ecpost.launch.launch_map:main"

[project.urls]
"Homepage" = "https://github.com/asozza/ecearth-outpost"
"Repository" = "https://github.com/asozza/ecearth-outpost"
"Documentation" = "https://github.com/asozza/ecearth-outpost"
"Bug Tracker" = "https://github.com/asozza/ecearth-outpost/issues"
