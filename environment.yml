# Create the conda environment:
# conda env create -f environment.yml -n [ecearth-outpost,ecpost,...]
#name: ecearth-outpost

channels:
  - conda-forge

dependencies:
  - python==3.12
  - ipykernel
  - numpy
  - scipy
  - xarray
  - dask
  - cdo=2.4.0
  - matplotlib
  - seaborn
  - netcdf4
  - nc-time-axis
  - cftime
  - gsw
  - psutil
  - pip
  - pip:
    - -e .
